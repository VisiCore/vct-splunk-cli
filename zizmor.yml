#
# Org-wide zizmor policy. The unpinned-uses audit defaults to requiring SHA pins
# for every action reference — correct for untrusted publishers, but high-
# friction noise for vendors who maintain stable major-version tags.
#
# Trusted publishers below may use `ref-pin` (version tags). Everything else
# falls through to zizmor's implicit `hash-pin` default. `astral-sh/*` is trusted
# because uv/ruff/ty are the org's mandated Python toolchain (added 2026-06).
rules:
  unpinned-uses:
    config:
      policies:
        actions/*: ref-pin
        astral-sh/*: ref-pin
        DeterminateSystems/*: ref-pin
        dryvist/*: ref-pin
        googleapis/*: ref-pin
