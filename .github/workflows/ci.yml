name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Review dependency changes on every pull request. This repository is public,
  # so GitHub can provide the dependency graph used by this official action.
  dependency-review:
    permissions:
      contents: read
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5
        with:
          fail-on-severity: moderate

  # Keep workflow-policy enforcement centralized without instantiating the
  # unrelated Nix, Ansible, Markdown, or file-size jobs from _ci-gate.
  workflow-security:
    if: github.event_name == 'pull_request'
    uses: dryvist/.github/.github/workflows/_zizmor.yml@main
    with:
      runner_label: ubuntu-latest

  # Run only the latest supported Python on PRs. A push to main (which occurs
  # after a merge) runs the supported min/latest matrix. This is deliberately
  # downstream of every applicable pull-request check above.
  python:
    needs: [dependency-review, workflow-security]
    if: >-
      ${{
        !cancelled() &&
        (github.event_name == 'push' ||
          (needs.dependency-review.result == 'success' &&
            needs.workflow-security.result == 'success'))
      }}
    uses: dryvist/.github/.github/workflows/_python-ci.yml@main
    with:
      python_versions: >-
        ${{
          github.event_name == 'pull_request' &&
          '["3.14"]' ||
          '["3.10", "3.14"]'
        }}
      gate_python_version: "3.14"
      runner_label: ubuntu-latest

  # Real create -> verify -> cleanup against a Dockerized Splunk Enterprise 10.x.
  # COST CONTROL: this is expensive (boots a Splunk container, several minutes), so
  # it runs ONLY on manual dispatch -- never on push or pull_request -- and is
  # hard-capped by timeout-minutes. It is informational; the `gate` job is the gate.
  # Run it on demand from the Actions tab ("Run workflow") when you want a live check.
  integration:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # We only support Splunk 10.x; `latest` tracks the current 10.x release.
        # Splunk 10 requires accepting the general terms (SPLUNK_GENERAL_TERMS below).
        splunk-version: ["latest"]
    env:
      # A throwaway admin password for the ephemeral container. Override with the
      # SPLUNK_TEST_PASSWORD secret if org policy requires it.
      SPLUNK_PASSWORD: ${{ secrets.SPLUNK_TEST_PASSWORD || 'Ch4ng3d-CI-Pass!' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      - name: Install project
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: Start Splunk
        run: |
          docker run -d --name splunk -p 8089:8089 \
            -e SPLUNK_GENERAL_TERMS=--accept-sgt-current-at-splunk-com \
            -e SPLUNK_START_ARGS=--accept-license \
            -e SPLUNK_PASSWORD="$SPLUNK_PASSWORD" \
            splunk/splunk:${{ matrix.splunk-version }}

      - name: Wait for splunkd
        run: bash .github/scripts/wait-for-splunk.sh

      # No auth script: the CLI exchanges SPLUNK_USERNAME/SPLUNK_PASSWORD for a
      # session key itself (via /services/auth/login) when no token is set.
      - name: Integration tests
        env:
          SPLUNK_INTEGRATION_TEST: "true"
          SPLUNK_URL: https://localhost:8089
          SPLUNK_USERNAME: admin
          SPLUNK_PASSWORD: ${{ env.SPLUNK_PASSWORD }}
          SPLUNK_VERIFY: "false"
        run: .venv/bin/pytest -m integration -v

      - name: Splunk logs on failure
        if: failure()
        run: docker logs splunk
