name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # The lint/format/type/hygiene gate is defined ONCE in .pre-commit-config.yaml.
  # CI runs that exact hook set so local pre-commit and CI never drift apart.
  # `uv run` installs the project + dev extra implicitly, so no separate
  # venv/install script is needed (setup-uv only installs uv, not the project).
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # TODO: switch to @v8 (major-moving) once Astral publishes that tag;
      # only v8.x.x full tags exist today, so this pins the latest full v8.
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.14"
      - run: uv run --extra dev pre-commit run --all-files --show-diff-on-failure

  # pytest across the min and max supported Python. Separate from `gate` because
  # tests — unlike the lint gate — must run on every supported version.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v7
      # TODO: switch to @v8 (major-moving) once Astral publishes that tag;
      # only v8.x.x full tags exist today, so this pins the latest full v8.
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv run --extra dev pytest
