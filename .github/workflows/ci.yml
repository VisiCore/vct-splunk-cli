name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Review dependency changes on every pull request. This repository is public,
  # so GitHub can provide the dependency graph used by this official action.
  dependency-review:
    permissions:
      contents: read
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5
        with:
          fail-on-severity: moderate

  # Keep workflow-policy enforcement centralized without instantiating the
  # unrelated Nix, Ansible, Markdown, or file-size jobs from _ci-gate.
  #
  # Reusable workflows are pinned to a commit SHA, like every other `uses:` in
  # this repository. A branch or tag can be repointed at new code after review,
  # which would hand anything able to push to that repository code execution
  # here. Bump deliberately: resolve the new SHA with
  # `gh api repos/dryvist/.github/commits/main --jq .sha`, read the diff, then
  # update both references below and their dated comments.
  workflow-security:
    if: github.event_name == 'pull_request'
    uses: dryvist/.github/.github/workflows/_zizmor.yml@7b9b165be9556c0228830c25246df2bde10a188e # main @ 2026-08-02
    with:
      runner_label: ubuntu-latest

  # Run the floor and the latest supported Python on PRs, so a break against
  # either end of the supported range surfaces before merge. A push to main
  # (which occurs after a merge) runs every supported Python. This is
  # deliberately downstream of every applicable pull-request check above.
  python:
    needs: [dependency-review, workflow-security]
    if: >-
      ${{
        !cancelled() &&
        (github.event_name != 'pull_request' ||
          (needs.dependency-review.result == 'success' &&
            needs.workflow-security.result == 'success'))
      }}
    uses: dryvist/.github/.github/workflows/_python-ci.yml@7b9b165be9556c0228830c25246df2bde10a188e # main @ 2026-08-02
    with:
      python_versions: >-
        ${{
          github.event_name == 'push' &&
          '["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]' ||
          '["3.9", "3.14"]'
        }}
      gate_python_version: "3.14"
      runner_label: ubuntu-latest

  # Cost gate for the Enterprise container job: only PRs that touch code or
  # this workflow pay for a live Splunk boot. Docs-only PRs skip it, and the
  # skipped required check still satisfies branch protection.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Detect code changes
        id: filter
        env:
          BASE_REF: ${{ github.base_ref }}
        # Invoked through `bash` so the job does not depend on the executable
        # bit surviving every checkout.
        run: bash .github/scripts/detect-code-changes.sh

  enterprise:
    name: Enterprise / Full CLI
    needs: [python, changes]
    if: >-
      ${{
        !cancelled() && needs.python.result == 'success' &&
        (github.event_name != 'pull_request' ||
          needs.changes.outputs.code == 'true')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SPLUNK_INTEGRATION_TEST: "true"
      SPLUNK_WRITE_TEST: "true"
      SPLUNK_URL: https://localhost:8089
      SPLUNK_USERNAME: admin
      SPLUNK_PASSWORD: Ch4ng3d-CI-Pass!
      SPLUNK_VERIFY: "false"
      SPLUNK_TEST_SERVER_FIXTURE_DIR: /opt/splunk/var/run/splunk/lookup_tmp
      VCT_SPLUNK_AUDIT: /tmp/vct-splunk-audit.log
    services:
      splunk:
        image: splunk/splunk:latest # zizmor: ignore[unpinned-images] Required current-version canary.
        env:
          SPLUNK_GENERAL_TERMS: --accept-sgt-current-at-splunk-com
          SPLUNK_START_ARGS: --accept-license
          SPLUNK_PASSWORD: Ch4ng3d-CI-Pass!
        ports:
          - 8089:8089
        # Splunk 10 first boot takes several minutes; GitHub waits for this
        # health check before running any step against the container.
        options: >-
          --health-cmd "curl -ksf -u admin:Ch4ng3d-CI-Pass! https://localhost:8089/services/server/info"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 60
          --health-start-period 120s
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
          cache: pip

      # `venv` and `pip` ship with Python, so this is the exact command a
      # Dependencies come from a hash-pinned lock so a compromised or
      # yanked-and-replaced release on PyPI cannot change what CI runs. The
      # project itself installs separately with --no-deps: nothing is resolved
      # outside the lock. Contributors still run `pip install -e ".[dev]"`.
      - name: Install project
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes -r requirements-ci.txt
          .venv/bin/python -m pip install -e . --no-deps

      - name: Stage server fixtures
        env:
          SPLUNK_CONTAINER_ID: ${{ job.services.splunk.id }}
        run: |
          docker exec -u root "$SPLUNK_CONTAINER_ID" \
            mkdir -p "$SPLUNK_TEST_SERVER_FIXTURE_DIR"
          docker cp tests/data/server/. \
            "$SPLUNK_CONTAINER_ID:$SPLUNK_TEST_SERVER_FIXTURE_DIR/"
          docker exec -u root "$SPLUNK_CONTAINER_ID" \
            tar -czf "$SPLUNK_TEST_SERVER_FIXTURE_DIR/vct_ci_app.spl" \
            -C "$SPLUNK_TEST_SERVER_FIXTURE_DIR" vct_ci_app
          docker cp tests/data/server/vct_test_input.sh \
            "$SPLUNK_CONTAINER_ID:/opt/splunk/etc/apps/search/bin/vct_test_input.sh"
          docker exec -u root "$SPLUNK_CONTAINER_ID" \
            chown -R splunk:splunk "$SPLUNK_TEST_SERVER_FIXTURE_DIR" \
            /opt/splunk/etc/apps/search/bin/vct_test_input.sh
          docker exec -u root "$SPLUNK_CONTAINER_ID" \
            chmod 755 /opt/splunk/etc/apps/search/bin/vct_test_input.sh

      - name: Enterprise reads (every catalogued read)
        run: >-
          .venv/bin/pytest tests/integration/enterprise/read
          -m "integration and enterprise and read"
          -vv --color=yes --tb=short --junitxml=enterprise-read.xml

      - name: Enterprise writes (every catalogued mutation)
        run: >-
          .venv/bin/pytest tests/integration/enterprise/write
          -m "integration and enterprise and write"
          -k test_write_leaf
          -vv --color=yes --tb=short --junitxml=enterprise-write.xml

      - name: Enterprise restart and reconnect
        run: >-
          .venv/bin/pytest tests/integration/enterprise/write/test_write_catalog.py
          -m "integration and enterprise and write"
          -k test_restart_reconnect
          -vv --color=yes --tb=short --junitxml=enterprise-restart.xml

      - name: Enterprise cleanup verification
        run: >-
          .venv/bin/pytest tests/integration/enterprise/write/test_cleanup.py
          -m "integration and enterprise and read"
          -vv --color=yes --tb=short --junitxml=enterprise-cleanup.xml

      - name: Publish test summary
        if: always()
        uses: test-summary/action@37b508cfee6d4d080eedd00b5bb240a6a784a6a5 # v2
        with:
          paths: enterprise-*.xml

      - name: Capture failure diagnostics
        if: failure()
        env:
          SPLUNK_CONTAINER_ID: ${{ job.services.splunk.id }}
        run: |
          mkdir -p artifacts
          docker logs "$SPLUNK_CONTAINER_ID" > artifacts/splunk.log 2>&1 || true
          docker inspect "$SPLUNK_CONTAINER_ID" > artifacts/container.json 2>&1 || true
          docker stats --no-stream "$SPLUNK_CONTAINER_ID" \
            > artifacts/resources.txt 2>&1 || true
          cp "$VCT_SPLUNK_AUDIT" artifacts/audit.log 2>&1 || true
          docker exec "$SPLUNK_CONTAINER_ID" \
            find /opt/splunk/etc/apps -maxdepth 2 -mindepth 1 -type d \
            > artifacts/apps.txt 2>&1 || true

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: enterprise-failure-${{ github.run_id }}
          path: |
            artifacts/
            enterprise-*.xml
          if-no-files-found: ignore

  # Fuzz the credential stripper. `safe_target` is what keeps a password in
  # SPLUNK_URL out of prompts, JSON metadata, and the audit log, and it is
  # handed the URL exactly as typed — before anything validates that it parses.
  # A short run per PR is enough to catch a regression in the shapes that
  # example-based tests do not think to write down.
  #
  # Linux-only, and separate from the test matrix: atheris publishes manylinux
  # x86_64 wheels only, so it must never join pyproject.toml's `dev` extra.
  fuzz:
    name: Fuzz / Credential stripper
    needs: [python, changes]
    if: >-
      ${{
        !cancelled() && needs.python.result == 'success' &&
        (github.event_name != 'pull_request' ||
          needs.changes.outputs.code == 'true')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install project
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes -r requirements-fuzz.txt
          .venv/bin/python -m pip install -e . --no-deps

      # Bounded by wall clock rather than iteration count so the job cost stays
      # predictable as the corpus grows.
      - name: Fuzz safe_target
        run: .venv/bin/python tests/fuzz/fuzz_redact.py -max_total_time=60 -print_final_stats=1

      - name: Upload crash corpus
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fuzz-crash-${{ github.run_id }}
          path: crash-*
          if-no-files-found: ignore

  # ============================================================================
  # MERGE GATE — the only check branch protection requires.
  # `name:` MUST stay "Merge Gate": required_status_checks matches the context
  # string exactly, and this is the org-wide convention (dryvist/.github
  # `_ci-gate.yml`). Because every other job feeds this one, adding a job later
  # never needs a branch-protection edit.
  # ============================================================================
  merge-gate:
    name: Merge Gate
    needs: [dependency-review, workflow-security, python, changes, enterprise, fuzz]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Aggregate results
        uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # release/v1
        with:
          # These jobs are conditional (pull-request-only, or paths-filtered), so
          # a skip is a legitimate outcome and must not fail the gate. `python`
          # is deliberately absent: it runs on every event and must succeed.
          allowed-skips: dependency-review, workflow-security, changes, enterprise, fuzz
          jobs: ${{ toJSON(needs) }}
