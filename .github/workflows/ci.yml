name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Thin consumer of the org-wide reusable CI gate. Every `run:` step and the
# zizmor policy live ONCE in dryvist/.github — this repo carries neither.
# `python_ci` runs _python-ci.yml: `uv run --extra dev pre-commit run --all-files`
# (ruff + ruff-format + pyright + hygiene + markdownlint) + central zizmor +
# pytest across the matrix. Gated by the `python` paths-filter.
jobs:
  gate:
    permissions:
      contents: read
      pull-requests: read
      actions: write # required: _ci-gate.yml's queue watchdog cancels stuck jobs
    uses: dryvist/.github/.github/workflows/_ci-gate.yml@main
    with:
      python_ci: true
      # This repo narrows to min + latest; the org default is all non-EOL.
      python_ci_versions: '["3.10", "3.14"]'
      filters: |
        python:
          - '**/*.py'
          - '**/*.md'
          - 'pyproject.toml'
          - '.pre-commit-config.yaml'
          - '.markdownlint-cli2.yaml'
          - '.github/workflows/**'
