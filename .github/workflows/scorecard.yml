# OpenSSF Scorecard — a weekly audit of this repository's security practices
# (action pinning, workflow permissions, branch protection, code scanning,
# dependency review). Results are published so the README badge and the public
# Scorecard API report the current score.
name: Scorecard

on:
  schedule:
    - cron: "23 7 * * 2"
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Upload the SARIF result to the code-scanning dashboard.
      security-events: write
      # Mint the OIDC token that publishes the result to the public API.
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # Publishing is what makes the README badge and the public report
          # resolve. It sends only the score, never repository content.
          publish_results: true

      - name: Upload results to code scanning
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          sarif_file: results.sarif
