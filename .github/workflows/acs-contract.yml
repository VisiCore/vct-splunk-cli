name: ACS Public Contract

on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-contract:
    name: ACS / Public OpenAPI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SPLUNK_ACS_SPEC_TEST: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install project
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e ".[dev]"

      - name: Check current public ACS contract
        run: >-
          .venv/bin/pytest tests/integration/test_acs_public_spec.py
          -vv --tb=short --junitxml=acs-contract.xml

      - name: Publish test summary
        if: always()
        uses: test-summary/action@37b508cfee6d4d080eedd00b5bb240a6a784a6a5 # v2
        with:
          paths: acs-contract.xml
