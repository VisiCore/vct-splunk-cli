name: Splunk Cloud Read Canary

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cloud-read:
    name: Cloud / ACS reads
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SPLUNK_ACS_LIVE_TEST: "true"
      SPLUNK_URL: ${{ secrets.SPLUNK_URL }}
      SPLUNK_ACS_TOKEN: ${{ secrets.SPLUNK_ACS_TOKEN }}
      SPLUNK_ACS_STACK: ${{ secrets.SPLUNK_ACS_STACK }}
      SPLUNK_ACS_BASE_URL: ${{ secrets.SPLUNK_ACS_BASE_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.14"

      - name: Install project
        run: |
          uv venv --python 3.14
          uv pip install -e ".[dev]"

      - name: Run read-only Cloud canary
        run: >-
          .venv/bin/pytest -m "integration and cloud and read"
          -vv --tb=short --junitxml=cloud-read.xml

      - name: Publish test summary
        if: always()
        uses: test-summary/action@37b508cfee6d4d080eedd00b5bb240a6a784a6a5 # v2
        with:
          paths: cloud-read.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cloud-read-${{ github.run_id }}
          path: cloud-read.xml
          if-no-files-found: ignore
