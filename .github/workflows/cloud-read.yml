# Certify the Cloud read path against a real Splunk Cloud stack.
#
# The Cloud contract itself is proved on every pull request, credential-free, by
# tests/unit/test_acs_loopback.py and tests/unit/test_write_gating.py.
# What only a live stack can show is that a real one answers the way the ACS
# specification says it does. Until a stack is configured, this workflow ends as
# an explicit no-op rather than a green run that checked nothing. The write
# canary calls it with `require_credentials: true`, where a no-op fails instead.
name: Splunk Cloud Read Canary

on:
  schedule:
    - cron: "41 6 * * 3"
  workflow_dispatch:
  workflow_call:
    inputs:
      require_credentials:
        description: Fail instead of no-op when no Cloud read credentials are configured
        type: boolean
        default: false
    secrets:
      SPLUNK_URL:
      SPLUNK_ACS_TOKEN:
      SPLUNK_ACS_STACK:
      SPLUNK_ACS_BASE_URL:
      SPLUNK_TOKEN:

permissions:
  contents: read

jobs:
  cloud-read:
    name: Cloud / ACS reads
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SPLUNK_ACS_LIVE_TEST: "true"
      SPLUNK_URL: ${{ secrets.SPLUNK_URL }}
      SPLUNK_ACS_TOKEN: ${{ secrets.SPLUNK_ACS_TOKEN }}
      SPLUNK_ACS_STACK: ${{ secrets.SPLUNK_ACS_STACK }}
      SPLUNK_ACS_BASE_URL: ${{ secrets.SPLUNK_ACS_BASE_URL }}
      # splunkd credential. Without it, every read Cloud does not serve stops at
      # the credential check instead of reaching the dispatch layer, so the run
      # covers far less than it appears to. The guard below says so out loud.
      SPLUNK_TOKEN: ${{ secrets.SPLUNK_TOKEN }}
      # Untrusted output boundary: hide the Cloud stack name in prompts, JSON
      # and table output, and error messages and details.
      VCT_SPLUNK_REDACT_TARGET: "1"
      CLOUD_CONFIGURED: ${{ secrets.SPLUNK_URL != '' || secrets.SPLUNK_ACS_TOKEN != '' || secrets.SPLUNK_TOKEN != '' }}
      CLOUD_READY: ${{ secrets.SPLUNK_URL != '' && secrets.SPLUNK_ACS_TOKEN != '' && secrets.SPLUNK_TOKEN != '' }}
      PYTEST_ADDOPTS: >-
        -q --tb=line -r N -o 'addopts=--strict-markers --import-mode=importlib'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Require complete Cloud read credentials when configured
        if: env.CLOUD_READY != 'true'
        env:
          CLOUD_REQUIRED: ${{ inputs.require_credentials == true }}
        run: |
          if [ "$CLOUD_CONFIGURED" = "true" ] || [ "$CLOUD_REQUIRED" = "true" ]; then
            echo "A partial Cloud read credential set is configured; SPLUNK_URL, SPLUNK_ACS_TOKEN, and SPLUNK_TOKEN are all required."
            exit 1
          fi
          echo "::notice::No Cloud read credentials are configured; no stack was certified."

      - if: env.CLOUD_READY == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install project
        if: env.CLOUD_READY == 'true'
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes -r requirements-ci.txt
          .venv/bin/python -m pip install -e . --no-deps

      - name: Cloud reads (every catalogued read command)
        if: env.CLOUD_READY == 'true'
        run: >-
          .venv/bin/pytest tests/integration/cloud/read/test_catalog.py
          -m "integration and cloud and read" --junitxml=cloud-read.xml

      - name: Cloud ACS operations (below the CLI)
        if: env.CLOUD_READY == 'true'
        run: >-
          .venv/bin/pytest tests/integration/cloud/read/test_acs_operations.py
          -m "integration and cloud and read" --junitxml=cloud-acs.xml

      - name: Publish test summary
        if: always() && env.CLOUD_READY == 'true'
        uses: test-summary/action@37b508cfee6d4d080eedd00b5bb240a6a784a6a5 # v2
        with:
          paths: cloud-*.xml

      - name: Upload test report
        if: always() && env.CLOUD_READY == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cloud-read-${{ github.run_id }}
          path: cloud-*.xml
          if-no-files-found: ignore
