# Canonical source: dryvist/.github/.markdownlint-cli2.yaml
# This is a verbatim copy pulled at scaffold time so non-Nix consumers share the
# org markdown rules. Edit the canonical file, then re-sync; never diverge here.
# (Renovate custom-manager sync is TBD; currently manual copy.)
# ─────────────────────────────────────────────────────────────────────────────
#
# dryvist organization-wide markdownlint canonical.
#
# Tooling pairing: Biome handles JS/TS/JSON/CSS at lineWidth 100 (see biome.jsonc).
# markdownlint-cli2 covers .md prose at the wider line_length below because prose
# does not need to wrap to the same width as code.
#
# Schema: https://github.com/DavidAnson/markdownlint-cli2/blob/main/schema/markdownlint-cli2-config-schema.json

config:
  MD013:
    line_length: 160
    tables: true
    strict: true

# CHANGELOG.md is auto-generated by release-please; its commit-link lines (MD013)
# and cross-version section headers (MD024) would force unavoidable violations.
ignores:
  - "CHANGELOG.md"
