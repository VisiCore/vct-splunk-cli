[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vct-splunk-cli"
version = "0.1.0"
description = "splunk — read, search, health-check, and safely administer Splunk Enterprise over its REST API"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = ["click>=8.1", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
splunk = "vct_splunk.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vct_splunk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a live Splunk (set SPLUNK_INTEGRATION_TEST=true)"]

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"
