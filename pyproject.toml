[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vct-splunk-cli"
description = "splunk — read, search, health-check, and safely administer Splunk Enterprise over its REST API"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "VisiCore Technologies" },
    { name = "Jacob Evans" },
]
keywords = ["splunk", "cli", "rest-api", "observability", "siem"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
dynamic = ["version"]
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    # pytest 9 requires Python 3.10; 8.4 is the newest release that still runs on
    # the 3.9 floor. Resolution picks 9.x on 3.10+ and 8.4.x on 3.9.
    "pytest>=8.4",
    "ruff>=0.16",
    "pyright>=1.1.411",
    # pre-commit requires Python 3.10. The lint/format/type gate runs on a
    # modern interpreter; the 3.9 leg only needs to run the test suite.
    "pre-commit>=4.6; python_version >= '3.10'",
]

[project.scripts]
splunk = "vct_splunk.cli:main"

[project.urls]
Homepage = "https://github.com/VisiCore/vct-splunk-cli"
Repository = "https://github.com/VisiCore/vct-splunk-cli"
Issues = "https://github.com/VisiCore/vct-splunk-cli/issues"
Changelog = "https://github.com/VisiCore/vct-splunk-cli/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "VERSION"
pattern = '(?P<version>[^\s]+)'

[tool.hatch.build.targets.wheel]
packages = ["src/vct_splunk"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "VERSION", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# importlib import mode lets the Enterprise and Cloud suites share the
# `test_catalog.py` filename; `pythonpath` keeps the shared `cli_catalog` helper
# importable without relying on a conftest side effect.
addopts = "-ra --strict-markers --import-mode=importlib"
pythonpath = ["tests"]
markers = [
    "integration: end-to-end test needing a live Splunk (set SPLUNK_INTEGRATION_TEST=true)",
    "enterprise: tests against Splunk Enterprise",
    "cloud: tests against Splunk Cloud",
    "acs: tests against the Admin Config Service",
    "read: read-only tests",
    "write: tests that mutate a disposable target",
]

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]

[tool.pyright]
# Check against the floor, not the interpreter that happens to be in .venv.
pythonVersion = "3.9"
include = ["src", "tests"]
extraPaths = ["src"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"
