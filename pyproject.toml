[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vct-splunk-cli"
description = "splunk — read, search, health-check, and safely administer Splunk Enterprise over its REST API"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "VisiCore" }]
keywords = ["splunk", "cli", "rest-api", "observability", "siem"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
dynamic = ["version"]
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "ruff>=0.15",
    "pyright>=1.1.405",
    "pre-commit>=4.6",
]

[project.scripts]
splunk = "vct_splunk.cli:main"

[project.urls]
Homepage = "https://github.com/VisiCore/vct-splunk-cli"
Repository = "https://github.com/VisiCore/vct-splunk-cli"
Issues = "https://github.com/VisiCore/vct-splunk-cli/issues"
Changelog = "https://github.com/VisiCore/vct-splunk-cli/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "VERSION"
pattern = '(?P<version>[^\s]+)'

[tool.hatch.build.targets.wheel]
packages = ["src/vct_splunk"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "VERSION", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: end-to-end test needing a live Splunk (set SPLUNK_INTEGRATION_TEST=true)",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"
